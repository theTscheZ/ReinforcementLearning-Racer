
behaviors:
  "CarAgent":
    trainer_type: ppo

    keep_checkpoints: 5
    even_checkpoints: false
    checkpoint_interval: 500000
    max_steps: 500000
    time_horizon: 64
    summary_freq: 10000
    threaded: false

    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.01
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
      conditioning_type: none

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
